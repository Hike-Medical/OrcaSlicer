name: Build CLI (ZAA)

on:
  workflow_dispatch:
  push:
    branches:
      - nik/non_planar

jobs:
  build_cli:
    name: Build SoleSlicer CLI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'true'

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Cache deps
        id: cache_deps
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/deps/build/OrcaSlicer_dep
          key: ubuntu-24.04-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}

      - name: Install system packages
        run: |
          mkdir -p deps/build/destdir
          sudo ./build_linux.sh -ur

      - name: Build dependencies
        if: steps.cache_deps.outputs.cache-hit != 'true'
        run: ./build_linux.sh -dr

      - name: Build SoleSlicer
        run: ./build_linux.sh -sr

      - name: Collect CLI binary
        run: |
          mkdir -p artifact
          cp build/src/orca-slicer artifact/
          # Also grab shared libs needed at runtime
          ldd build/src/orca-slicer | grep "=> /" | awk '{print $3}' | \
            xargs -I{} cp -n {} artifact/ 2>/dev/null || true
          ls -lh artifact/

      - name: Upload CLI binary
        uses: actions/upload-artifact@v6
        with:
          name: soleslicer-cli-linux-x64
          path: artifact/
          retention-days: 30
