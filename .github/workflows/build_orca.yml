on:
    workflow_call:
      inputs:
        cache-key:
          required: true
          type: string
        cache-path:
          required: true
          type: string
        os:
          required: true
          type: string
        arch:
          required: false
          type: string

jobs:
  build_orca:
    name: Build SoleSlicer
    runs-on: ${{ inputs.os }}
    env:
      date:
      ver:
      ver_pure:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'true'

      - name: load cached deps
        uses: actions/cache@v5
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.os }}-${{ github.ref_name }}-
            ccache-${{ inputs.os }}-main-
            ccache-${{ inputs.os }}-

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Resolve version label
        run: |
          ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            branch="${{ github.head_ref }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            branch="${{ github.ref_name }}"
          else
            branch="${{ github.ref_name }}"
          fi
          ver=$(echo "$branch" | tr '[:upper:]/' '[:lower:]-')
          echo "ver=$ver" >> $GITHUB_ENV
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Apt-Install Dependencies
        if: inputs.os == 'ubuntu-24.04'
        uses: ./.github/actions/apt-install-deps

      - name: Install ccache
        if: inputs.os == 'ubuntu-24.04'
        run: |
          sudo apt-get install -y ccache
          ccache --version
          ccache --zero-stats
          ccache --max-size=1G

      - name: Build slicer CLI
        if: inputs.os == 'ubuntu-24.04'
        shell: bash
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          ./build_linux.sh -sr -j "$(nproc)"

      - name: Print ccache stats
        if: inputs.os == 'ubuntu-24.04'
        run: ccache --show-stats

      - name: Collect CLI binary and shared libs
        if: inputs.os == 'ubuntu-24.04'
        run: |
          mkdir -p artifact
          BINARY=$(find build/ -name "orca-slicer" -type f -exec file {} \; | grep ELF | head -1 | cut -d: -f1)
          if [ -z "$BINARY" ]; then
            echo "ERROR: orca-slicer ELF binary not found"
            find build/src/ -type f -executable 2>/dev/null | head -20
            exit 1
          fi
          echo "Found binary: $BINARY ($(du -h "$BINARY" | cut -f1))"
          cp "$BINARY" artifact/orca-slicer
          chmod +x artifact/orca-slicer
          ldd "$BINARY" | grep "=> /" | awk '{print $3}' | \
            xargs -I{} cp -n {} artifact/ 2>/dev/null || true
          cp -r resources artifact/resources || true
          ls -lh artifact/

      - name: Upload SoleSlicer CLI
        if: inputs.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v6
        with:
          name: soleslicer-${{ env.ver }}-linux-amd64
          path: artifact/
