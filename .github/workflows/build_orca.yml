on:
    workflow_call:
      inputs:
        cache-key:
          required: true
          type: string
        cache-path:
          required: true
          type: string
        os:
          required: true
          type: string
        arch:
          required: false
          type: string

jobs:
  build_orca:
    name: Build SoleSlicer
    runs-on: ${{ inputs.os }}
    env:
      date:
      ver:
      ver_pure:

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'true'

      - name: load cached deps
        uses: actions/cache@v5
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Resolve version label
        run: |
          ver_pure=$(grep 'set(SoftFever_VERSION' version.inc | cut -d '"' -f2)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ver="PR-${{ github.event.number }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            ver="${{ github.ref_name }}"
          else
            branch="${{ github.ref_name }}"
            ver="${branch//\//-}"
          fi
          echo "ver=$ver" >> $GITHUB_ENV
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Apt-Install Dependencies
        if: inputs.os == 'ubuntu-24.04'
        uses: ./.github/actions/apt-install-deps

      - name: Build slicer and tests
        if: inputs.os == 'ubuntu-24.04'
        shell: bash
        run: |
          ./build_linux.sh -istr
          mv -n ./build/OrcaSlicer_Linux_V${{ env.ver_pure }}.AppImage \
                ./build/SoleSlicer_${{ env.ver }}_linux_amd64.AppImage
          chmod +x ./build/SoleSlicer_${{ env.ver }}_linux_amd64.AppImage
          tar -cvpf build_tests.tar build/tests

      - name: Upload Test Artifact
        if: inputs.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ github.sha }}-tests
          overwrite: true
          path: build_tests.tar
          retention-days: 5
          if-no-files-found: error

      - name: Upload SoleSlicer AppImage
        if: inputs.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v6
        with:
          name: SoleSlicer_${{ env.ver }}_linux_amd64
          path: './build/SoleSlicer_${{ env.ver }}_linux_amd64.AppImage'
