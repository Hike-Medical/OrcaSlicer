name: Build all

on:
  push:
    branches:
      - main
    paths:
     - 'deps/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - 'localization/**'
     - 'resources/**'
     - ".github/workflows/build_*.yml"
     - 'build_linux.sh'

  pull_request:
    paths:
     - 'deps/**'
     - 'deps_src/**'
     - 'src/**'
     - '**/CMakeLists.txt'
     - 'version.inc'
     - ".github/workflows/build_*.yml"
     - 'build_linux.sh'

  workflow_dispatch:
    inputs:
      build-deps-only:
        description: 'Only build dependencies (bypasses caching)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_linux:
    strategy:
      fail-fast: false
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ubuntu-24.04
      build-deps-only: ${{ inputs.build-deps-only || false }}
    secrets: inherit

  upload-to-s3:
    name: Upload to S3
    needs: build_linux
    runs-on: ubuntu-latest
    env:
      ARTIFACT_BUCKET: ai-staging-packages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve S3 folder
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            FOLDER="${{ github.head_ref }}"
          else
            FOLDER="${{ github.ref_name }}"
          fi
          FOLDER=$(echo "$FOLDER" | tr '[:upper:]/' '[:lower:]-')
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"
          echo "S3 folder: $FOLDER"

      - name: Download SoleSlicer CLI artifact
        uses: actions/download-artifact@v7
        with:
          pattern: soleslicer-*-linux-amd64
          path: artifact
          merge-multiple: true

      - name: Verify artifact contents
        run: |
          if [ ! -f artifact/orca-slicer ]; then
            echo "::error::orca-slicer binary not found in downloaded artifact"
            find artifact -type f | head -20
            exit 1
          fi
          file artifact/orca-slicer
          echo "Binary size: $(du -h artifact/orca-slicer | cut -f1)"

      - name: Package tarball
        id: package
        run: |
          TARBALL="soleslicer-linux-amd64.tar.gz"
          tar -czf "$TARBALL" -C artifact .
          SHA256=$(sha256sum "$TARBALL" | awk '{print $1}')
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Tarball: $TARBALL ($(du -h "$TARBALL" | cut -f1), sha256: $SHA256)"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        env:
          FOLDER: ${{ steps.meta.outputs.folder }}
          TARBALL: ${{ steps.package.outputs.tarball }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          S3_PATH="s3://${ARTIFACT_BUCKET}/soleslicer/${FOLDER}/soleslicer-linux-amd64.tar.gz"
          echo "Uploading to ${S3_PATH} ..."
          aws s3 cp "$TARBALL" "$S3_PATH" \
            --metadata "sha256=${SHA256}"

          echo "${SHA256}  soleslicer-linux-amd64.tar.gz" > sha256.txt
          aws s3 cp sha256.txt "s3://${ARTIFACT_BUCKET}/soleslicer/${FOLDER}/sha256.txt"

          echo ""
          echo "=== Uploaded ==="
          echo "  ${S3_PATH}"
          echo "  SHA256: ${SHA256}"

      - name: Verify S3 upload
        env:
          FOLDER: ${{ steps.meta.outputs.folder }}
        run: |
          aws s3 ls "s3://${ARTIFACT_BUCKET}/soleslicer/${FOLDER}/"
